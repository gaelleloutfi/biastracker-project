[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protperties"
version = "0.1.0"
description = "Protein properties and protocol comparison from Mass Spectrometry inputs"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Gaelle Loutfi", email = "gaelle.loutfi@inserm.fr"}]
license = {text = "MIT"}
dependencies = [
  "biopython>=1.81",
  "pyteomics>=4.6",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.11",
  "typer>=0.9",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "pyarrow>=12.0",
  "openpyxl>=3.0",
  "requests>=2.32",
]

[project.scripts]
protperties = "protperties.cli:app"  # CLI command -> Typer app

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
