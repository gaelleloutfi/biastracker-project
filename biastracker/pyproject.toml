[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biastracker"
version = "0.1.0"
description = "A tool to track and analyze biases in proteomics datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
    "typer",
    "pydantic",
    "pyyaml",
    "protperties"
]

[project.scripts]
biastracker = "biastracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
